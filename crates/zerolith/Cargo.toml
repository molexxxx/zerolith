[package]
name = "zerolith"
description = "The zerolith command line: a production bundler built on Rolldown, a dev server that serves TypeScript and JSX, import map generation, and project checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["zerolith", "frontend", "dev-server", "import-map"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "zerolith"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
notify = "8.2.1"
oxc_allocator = "0.156.0"
oxc_ast = "0.156.0"
oxc_ast_visit = "0.156.0"
oxc_codegen = "0.156.0"
oxc_diagnostics = "0.156.0"
oxc_parser = "0.156.0"
oxc_resolver = "11.24.3"
oxc_semantic = "0.156.0"
oxc_span = "0.156.0"
oxc_transformer = "0.156.0"
rolldown = { version = "1.2.16", default-features = false }
rolldown_common = { version = "1.2.16", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[lints]
workspace = true
