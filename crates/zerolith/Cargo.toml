[package]
name = "zerolith"
description = "The zerolith command line: a dev server for the buildless path, import map generation, and project checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["zerolith", "frontend", "dev-server", "import-map"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "zerolith"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[lints]
workspace = true
