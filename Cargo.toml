[workspace]
resolver = "3"
members = ["crates/zerolith"]

[workspace.package]
version = "0.1.0-alpha.5"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
repository = "https://github.com/molexxxx/zerolith"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
