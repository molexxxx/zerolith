version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
  - package-ecosystem: npm
    directory: /.github/npm
    schedule:
      interval: weekly
    versioning-strategy: increase
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: npm
        update-types: ["version-update:semver-major"]
