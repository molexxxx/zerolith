name: Docs

# Builds the documentation site and deploys it to GitHub Pages. The release
# workflow calls it with the commit it just published, so the site always
# describes what the registry serves; a manual run redeploys a given ref.
# The base path comes from the Pages configuration, so the same build
# serves the project site under /zerolith/ and a custom domain at its root.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build the site from
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to build the site from; the latest release unless there is a reason
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build packages
        run: npm run build

      - name: Build the site
        env:
          ZEROLITH_DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run docs

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
