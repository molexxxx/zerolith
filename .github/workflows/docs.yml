name: Docs

# Builds the documentation site and deploys it to GitHub Pages, always from
# the commit the run is on. The release workflow calls it after publishing,
# so the site describes what the registry serves; a manual run builds the
# ref it is dispatched on: main for a change to the site alone, or a release
# tag to deploy that release's site again.
# The base path and the address for canonical links come from the Pages
# configuration, so the same build serves the project site under
# /zerolith/ and a custom domain at its root.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build packages
        run: npm run build

      - name: Build the site
        env:
          ZEROLITH_DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
          ZEROLITH_DOCS_URL: ${{ steps.pages.outputs.base_url }}/
        run: npm run docs

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
