name: Benchmarks

# Measures a published release on js-framework-benchmark next to every
# framework benchmarks/frameworks.json lists, and next to the release before
# it in the same session, on a GitHub-hosted runner, and commits the run with the results section of benchmarks/README.md, the
# baseline, and the entry's pin, then deploys the docs site again so its
# benchmarks page shows the run. The release workflow starts it on the
# release's tag once the release is out; a manual run measures any published
# version again, on its tag where the tag holds this workflow, and with
# commit off checks the run and keeps it as an artifact only.
#
# Measuring builds the other frameworks' entries, which runs their packages
# and build tools, so that job holds no write access and no secret and hands
# on only the run's file. Run on a tag, it writes nothing a run on main
# could restore. The job that commits checks every field of that file, its
# version, and its frameworks, names it from what it holds, and runs no code
# but this repository's own.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to measure, such as 0.1.0-alpha.9
        required: true
      commit:
        description: Commit the run to main
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  measure:
    name: Measure ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          set -eu
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$VERSION is not a version"
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The release workflow starts this one right after publishing, and the
      # registry lists a version before its tarball downloads, so the run
      # waits until every package's tarball does.
      - name: Wait for the release on the registry
        run: |
          set -eu
          for attempt in $(seq 1 20); do
            if platforms="$(npm view "@zerolith/cli@$VERSION" optionalDependencies --json 2>/dev/null)"; then
              packages=("zerolith@$VERSION" "@zerolith/cli@$VERSION")
              while IFS= read -r platform; do
                packages+=("$platform")
              done < <(printf '%s' "$platforms" | jq -r 'to_entries[] | "\(.key)@\(.value)"')
              missing=""
              for package in "${packages[@]}"; do
                tarball="$(npm view "$package" dist.tarball 2>/dev/null || true)"
                if [ -z "$tarball" ] || ! curl -fsIL "$tarball" >/dev/null; then
                  missing="$missing $package"
                fi
              done
              if [ -z "$missing" ]; then
                exit 0
              fi
              echo "not served yet:$missing, attempt $attempt of 20"
            else
              echo "@zerolith/cli@$VERSION is not served yet, attempt $attempt of 20"
            fi
            sleep 30
          done
          exit 1

      - name: Read the entries
        id: entries
        run: echo "list=$(jq -r '[.frameworks[].entry | "keyed/" + .] | join(" ")' benchmarks/frameworks.json)" >> "$GITHUB_OUTPUT"

      # frameworks.json names the same repository and commit, and a test
      # holds the two equal.
      - name: Check out js-framework-benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krausest/js-framework-benchmark
          ref: ca8715d9ae84916fd24de3a79457d8c328f9b766
          path: jfb
          persist-credentials: false

      - name: Install the benchmark
        working-directory: jfb
        run: |
          set -eu
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run install-local
          mkdir -p frameworks/non-keyed

      # The benchmark's own checks start Chrome from the path it expects on
      # Linux; the benchmark itself is given the path below.
      - name: Point the benchmark at Chrome
        run: |
          set -eu
          sudo mkdir -p /snap/bin
          sudo ln -sf "$(command -v google-chrome)" /snap/bin/chromium
          /snap/bin/chromium --version

      - name: Pin the zerolith entry to the version
        run: |
          set -eu
          entry=jfb/frameworks/keyed/zerolith
          rm -rf "$entry"
          mkdir -p "$entry"
          cp -R benchmarks/js-framework-benchmark/index.html benchmarks/js-framework-benchmark/package.json benchmarks/js-framework-benchmark/src "$entry/"
          cd "$entry"
          npm pkg set "dependencies.zerolith=$VERSION" "devDependencies.@zerolith/cli=$VERSION"

      # The release before this one, the newest zerolith tag below it, joins
      # the run from its own tag's entry files, as zerolith-previous, so the
      # two compare on one machine whichever runs were made or skipped between.
      - name: Add the release before
        id: previous
        env:
          ENTRIES: ${{ steps.entries.outputs.list }}
        run: |
          set -eu
          previous="$(git ls-remote --tags --refs origin | sed -n 's|.*refs/tags/zerolith@||p' | node --input-type=module -e 'const { readFileSync } = await import("node:fs"); const { previousRelease } = await import("./benchmarks/results.ts"); process.stdout.write(previousRelease(process.argv[1], readFileSync(0, "utf8").split("\n")) ?? "");' "$VERSION")"
          if [ -z "$previous" ]; then
            echo "no release comes before $VERSION, so the run measures $VERSION alone"
            echo "entries=$ENTRIES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth 1 origin "refs/tags/zerolith@$previous:refs/tags/zerolith@$previous"
          mkdir -p "$RUNNER_TEMP/previous"
          git archive "zerolith@$previous" benchmarks/js-framework-benchmark | tar -x -C "$RUNNER_TEMP/previous"
          source="$RUNNER_TEMP/previous/benchmarks/js-framework-benchmark"
          entry=jfb/frameworks/keyed/zerolith-previous
          mkdir -p "$entry"
          cp -R "$source/index.html" "$source/package.json" "$source/src" "$entry/"
          cd "$entry"
          build="$(npm pkg get scripts.build-prod | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).replaceAll("/frameworks/keyed/zerolith/", "/frameworks/keyed/zerolith-previous/")')"
          npm pkg set "name=js-framework-benchmark-zerolith-previous" "scripts.build-prod=$build" "dependencies.zerolith=$previous" "devDependencies.@zerolith/cli=$previous"
          {
            echo "version=$previous"
            echo "entries=$ENTRIES keyed/zerolith-previous"
          } >> "$GITHUB_OUTPUT"

      - name: Start the benchmark's server
        working-directory: jfb
        run: |
          set -eu
          nohup npm start > server.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8080/frameworks/keyed/vanillajs/index.html; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      # Each entry installs from the lockfile the benchmark's repository
      # keeps for it, but the zerolith entries, whose versions this run sets:
      # the benchmark's rebuild installs them from their exact pins.
      - name: Build and check each entry
        working-directory: jfb
        env:
          ENTRIES: ${{ steps.previous.outputs.entries }}
        run: |
          set -euo pipefail
          for entry in $ENTRIES; do
            case "$entry" in
              keyed/zerolith | keyed/zerolith-previous) command=rebuild ;;
              *) command=rebuild-ci ;;
            esac
            npm run "$command" -- "$entry" 2>&1 | tee "$RUNNER_TEMP/rebuild.log"
            if grep -q "was not successful" "$RUNNER_TEMP/rebuild.log"; then
              echo "::error::$entry did not build, so the run stops before measuring anything"
              exit 1
            fi
          done

      - name: Run the benchmark
        working-directory: jfb
        env:
          ENTRIES: ${{ steps.previous.outputs.entries }}
        run: |
          set -eu
          # shellcheck disable=SC2086
          npm run bench -- --headless --chromeBinary "$(command -v google-chrome)" --framework $ENTRIES

      # The benchmark samples memory, size, and first paint once a pass, so
      # the run takes four more passes of them and keeps the medians.
      - name: Measure memory, size, and first paint again
        working-directory: jfb
        env:
          ENTRIES: ${{ steps.previous.outputs.entries }}
        run: |
          set -eu
          cp -R webdriver-ts/results "$RUNNER_TEMP/pass-1"
          for pass in 2 3 4 5; do
            # shellcheck disable=SC2086
            npm run bench -- --headless --chromeBinary "$(command -v google-chrome)" --benchmark 21_ 22_ 25_ 40_ --framework $ENTRIES
            cp -R webdriver-ts/results "$RUNNER_TEMP/pass-$pass"
          done

      # The frameworks within a few percent of zerolith decide where it
      # ranks, so their timed operations run a second time, after a cleared
      # results folder, and each of their medians is taken over both passes.
      - name: Measure the close frameworks' operations again
        working-directory: jfb
        env:
          ENTRIES: ${{ steps.previous.outputs.entries }}
        run: |
          set -eu
          close=""
          for entry in $ENTRIES; do
            case "$entry" in
              keyed/vanillajs | keyed/solid | keyed/svelte | keyed/zerolith | keyed/zerolith-previous) close="$close $entry" ;;
            esac
          done
          rm -rf webdriver-ts/results
          mkdir webdriver-ts/results
          # shellcheck disable=SC2086
          npm run bench -- --headless --chromeBinary "$(command -v google-chrome)" --benchmark 01_ 02_ 03_ 04_ 05_ 06_ 07_ 08_ 09_ --framework $close
          cp -R webdriver-ts/results "$RUNNER_TEMP/timed-2"

      # A run's text may hold only what checkRun in benchmarks/results.ts
      # takes, so the CPU's name loses characters such as the @ before its
      # clock speed.
      - name: Collect the run
        env:
          PREVIOUS: ${{ steps.previous.outputs.version }}
        run: |
          set -eu
          cpu="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
          machine="$(printf '%s' "$cpu, $(nproc) vCPUs, $(lsb_release -ds), $(google-chrome --version) headless, Node $(node --version)" | tr -cd "A-Za-z0-9 .,;:()+/'-" | tr -s ' ')"
          before=()
          if [ -n "$PREVIOUS" ]; then
            before=(--previous "$PREVIOUS")
          fi
          node benchmarks/collect.ts "$RUNNER_TEMP/pass-1" --again "$RUNNER_TEMP/pass-2" --again "$RUNNER_TEMP/pass-3" --again "$RUNNER_TEMP/pass-4" --again "$RUNNER_TEMP/pass-5" --timed "$RUNNER_TEMP/timed-2" --date "$(date -u +%F)" --zerolith "$VERSION" --method "medians of 15 runs, 30 for vanilla, Solid, Svelte, and zerolith, on a GitHub-hosted runner" --machine "$machine" "${before[@]}" --out "$RUNNER_TEMP/run.json"
          cat "$RUNNER_TEMP/run.json"

      - name: Keep the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-run
          path: ${{ runner.temp }}/run.json
          if-no-files-found: error
          retention-days: 90

  commit:
    name: Check and commit the run
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      deployments: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          set -eu
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$VERSION is not a version"
            exit 1
          fi

      # The full history and the tags, so the pin can ask whether the
      # release holds a commit the baseline names.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: ${{ inputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Take the run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-run
          path: ${{ runner.temp }}/run

      - name: Add the run and pin the release
        run: |
          set -eu
          node benchmarks/report.ts --pin "$VERSION" --add "$RUNNER_TEMP/run/run.json"
          git status --short
          git diff -- benchmarks/README.md

      - name: Commit and push
        if: ${{ inputs.commit }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/baseline benchmarks/README.md benchmarks/results benchmarks/js-framework-benchmark/package.json benchmarks/js-framework-benchmark/README.md docs/ROADMAP.md
          git commit -m "Add the $VERSION js-framework-benchmark run" -m "The benchmarks workflow measured $VERSION on a GitHub-hosted runner, next to the frameworks benchmarks/frameworks.json lists. The entry's pin follows the newest release measured, and the baseline with it unless it names a commit the release does not hold."
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1

      # The site composes its benchmarks page from the runs on main whichever
      # releases it shows, so a committed run reaches it with a deploy.
      - name: Deploy the site again
        if: ${{ inputs.commit }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main
