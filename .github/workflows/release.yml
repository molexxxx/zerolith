name: Release

# Publishes the npm packages and the crate with provenance. A tag of the
# form <package>@<version> publishes that package, and fails unless the
# version is the manifests' own; a manual run publishes the package named in
# the input, or every package in dependency order with "all". A package
# already on the registry at the version is skipped, so a run of "all" that
# failed partway completes when it is run again. Trusted publishing on npmjs.com (owner molexxxx, repository
# zerolith, workflow release.yml) is the normal credential; npm falls back to
# the granular token in the NPM_TOKEN secret for a package with no trusted
# publisher, as every new package is until its first publish, since npm
# attaches a trusted publisher only to a package it already has. A release
# with a name npm has never published checks that npm accepts the token and
# publishes that name before any other package, so a token that cannot
# create it stops the release before any package moves. The crate publishes through crates.io
# trusted publishing the same way: rust-lang/crates-io-auth-action trades
# the job's OIDC token for a 30-minute crates.io token and revokes it when
# the job ends, so no registry token is stored anywhere.
#
# Canaries run here too, so they publish through the same trusted
# publisher: every night, and on a manual run with "canary", every npm
# package is published under the canary dist-tag with a version such as
# 0.0.0-canary.20261101.g1a2b3c4 (scripts/canary.ts), which sorts below every
# release, when the packages, the crate, or the lockfiles changed since the
# last canary. A
# canary never moves latest, never publishes the crate, and creates no
# GitHub release or docs deployment. It leaves out a name npm has never
# published, since npm gives a package's first version the latest tag, so
# that first version comes from a release.
#
# One job installs, checks, builds, and packs the npm packages with no
# publishing credential, and another publishes its tarballs, installing
# nothing but the pinned npm without install scripts, so a compromised
# dependency's install script never runs beside the OIDC token or the
# NPM_TOKEN secret. The crate is checked and built as packaged in one job
# and published without a build from another, for the same reason.
#
# A release that publishes the core also rebuilds the documentation site
# from the same commit and deploys it to GitHub Pages, and a release of
# every package creates a GitHub release tagged zerolith@<version> with the
# version's changelog section and the SBOM, then starts the benchmarks
# workflow, which measures the release on js-framework-benchmark and commits
# its run. Until a stable version exists, each prerelease moves the latest
# dist-tag as well as its own.
#
# @zerolith/cli carries no binary: one platform package per target does,
# built here on the matching runner. Linux builds on Ubuntu 22.04 so the
# binaries link against glibc 2.35 and run on older distributions.

on:
  push:
    tags:
      - "zerolith@*"
      - "@zerolith/*@*"
      - "crate@*"
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to publish, or "all" for every package in order
        required: true
        default: all
      tag:
        description: npm dist-tag; empty takes latest for a stable version and the pre-release's own word, such as beta, for a pre-release
        required: false
        default: ""
      crate:
        description: Publish the Rust command line to crates.io too
        type: boolean
        default: false
      dry_run:
        description: Run everything but the upload
        type: boolean
        default: false
      canary:
        description: Publish a canary of every npm package under the canary dist-tag instead, ignoring the other inputs but dry_run
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  canary:
    name: canary check
    if: github.event_name == 'schedule' || github.event.inputs.canary == 'true'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Check
        id: check
        env:
          MANUAL: ${{ github.event.inputs.canary }}
        run: |
          set -eu
          version="$(node scripts/canary.ts version "$(date -u +%Y%m%d)" "$GITHUB_SHA")"
          publish=true
          # @zerolith/cli publishes last, so its canary names the last run that finished.
          if previous="$(npm view @zerolith/cli@canary version 2>/dev/null)" && [ -n "$previous" ]; then
            commit="$(node scripts/canary.ts commit "$previous")"
            if [ -n "$commit" ] && git cat-file -e "$commit^{commit}" 2>/dev/null \
              && git diff --quiet "$commit" HEAD -- packages crates Cargo.toml Cargo.lock package.json package-lock.json; then
              publish=false
            fi
          fi
          if [ "$MANUAL" = "true" ]; then
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "canary $version, publish: $publish"

  binaries:
    name: binary ${{ matrix.name }}
    needs: canary
    if: ${{ !cancelled() && (needs.canary.outputs.publish == 'true' || (needs.canary.result == 'skipped' && (github.event.inputs.package == 'all' || github.event.inputs.package == '@zerolith/cli' || startsWith(github.ref_name, '@zerolith/cli@')))) }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-22.04, binary: zerolith }
          - { name: linux-arm64, runner: ubuntu-22.04-arm, binary: zerolith }
          - { name: darwin-arm64, runner: macos-15, binary: zerolith }
          - { name: darwin-x64, runner: macos-15-intel, binary: zerolith }
          - { name: win32-x64, runner: windows-2025, binary: zerolith.exe }
          - { name: win32-arm64, runner: windows-11-arm, binary: zerolith.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: needs.canary.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Canary version
        if: needs.canary.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.canary.outputs.version }}
        run: |
          node scripts/version.ts "$VERSION"
          cargo update --workspace

      - name: Build
        run: cargo build --release --locked --package zerolith

      - name: Run the binary
        shell: bash
        run: |
          set -eu
          expected="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          printed="$(target/release/${{ matrix.binary }} --version)"
          echo "$printed"
          case "$printed" in
            *"$expected"*) ;;
            *) echo "::error::the binary printed $printed, not version $expected"; exit 1 ;;
          esac

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  # Installs, checks, builds, and packs every package in a job that holds no
  # publishing credential, since an install runs the dependencies' own
  # scripts; the npm job below publishes the tarballs it hands on.
  pack:
    name: pack ${{ needs.canary.outputs.publish == 'true' && 'canary' || github.event.inputs.package || github.ref_name }}
    needs: [canary, binaries]
    if: ${{ !cancelled() && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') && (needs.canary.outputs.publish == 'true' || (needs.canary.result == 'skipped' && (github.event_name == 'workflow_dispatch' || !startsWith(github.ref_name, 'crate@')))) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm
        run: |
          npm ci --prefix .github/npm --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: npm version
        run: npm --version

      - name: Tag version
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          if [ "${REF_NAME##*@}" != "$version" ]; then
            echo "::error::the tag $REF_NAME names ${REF_NAME##*@}, but the manifests hold $version"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Full check
        run: npm run check

      - name: Canary version
        if: needs.canary.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.canary.outputs.version }}
        run: |
          node scripts/version.ts "$VERSION"
          npm run build

      - name: Built versions
        run: node scripts/built-versions.ts

      - name: SBOM
        run: npm run sbom > sbom.cdx.json

      - name: Binaries
        if: needs.binaries.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{darwin,linux,win32}-*"
          path: packages/cli/platforms

      - name: Mark the binaries executable
        if: needs.binaries.result == 'success'
        run: find packages/cli/platforms -name zerolith -type f -exec chmod 755 {} +

      - name: Pack
        env:
          BINARIES: ${{ needs.binaries.result }}
        run: |
          set -eu
          packed="$RUNNER_TEMP/packed"
          mkdir -p "$packed"
          if [ "$BINARIES" = "success" ]; then
            for directory in packages/cli/platforms/*/; do
              ls "$directory"zerolith* >/dev/null
              (cd "$directory" && npm pack --pack-destination "$packed")
            done
            node scripts/platforms.ts
          fi
          npm pack --workspaces --pack-destination "$packed"
          # Without the binaries, @zerolith/cli would go out naming no platform package, so no tarball of it is made.
          if [ "$BINARIES" != "success" ]; then
            rm -f "$packed"/zerolith-cli-[0-9]*.tgz
          fi
          ls -l "$packed"

      - name: Upload the tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-${{ github.run_id }}
          path: ${{ runner.temp }}/packed
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.cdx.json
          retention-days: 90

  # Publishes the tarballs the pack job made. It installs nothing but the
  # pinned npm, without install scripts, so no dependency's code runs where
  # the OIDC token and the NPM_TOKEN secret are.
  npm:
    name: npm ${{ needs.canary.outputs.publish == 'true' && 'canary' || github.event.inputs.package || github.ref_name }}
    needs: [canary, pack]
    if: ${{ !cancelled() && needs.pack.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: npm
        run: |
          npm ci --prefix .github/npm --no-audit --no-fund --ignore-scripts
          echo "$GITHUB_WORKSPACE/.github/npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: npm version
        run: npm --version

      - name: Canary version
        if: needs.canary.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.canary.outputs.version }}
        run: node scripts/version.ts "$VERSION"

      - name: Tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-${{ github.run_id }}
          path: ${{ runner.temp }}/packed

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          CANARY: ${{ needs.canary.outputs.publish }}
          PACKED: ${{ runner.temp }}/packed
        run: |
          set -eu
          if [ "$CANARY" = "true" ]; then
            selection="all"
            tag="canary"
          else
            if [ -n "$INPUT_PACKAGE" ]; then
              selection="$INPUT_PACKAGE"
            else
              selection="${REF_NAME%@*}"
            fi
            tag="${INPUT_TAG:-}"
          fi
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*)
              prerelease="${version#*-}"
              if [ -z "$tag" ]; then
                tag="${prerelease%%.*}"
              elif [ "$tag" = "latest" ]; then
                echo "::error::$version is a pre-release, which goes under a tag of its own such as ${prerelease%%.*}, not latest, so nothing was published"
                exit 1
              fi
              ;;
            *)
              tag="${tag:-latest}"
              ;;
          esac
          flags="--access public --provenance --tag $tag"
          if [ "$DRY_RUN" = "true" ]; then
            flags="$flags --dry-run"
          fi
          libraries="zerolith @zerolith/router @zerolith/forms @zerolith/client @zerolith/test @zerolith/a11y @zerolith/state @zerolith/browser @zerolith/i18n @zerolith/devtools @zerolith/vite @zerolith/otel"
          platforms="@zerolith/cli-linux-x64 @zerolith/cli-linux-arm64 @zerolith/cli-darwin-arm64 @zerolith/cli-darwin-x64 @zerolith/cli-win32-x64 @zerolith/cli-win32-arm64"
          case "$selection" in
            all) packages="$libraries $platforms @zerolith/cli" ;;
            @zerolith/cli) packages="$platforms @zerolith/cli" ;;
            *) packages="$selection" ;;
          esac
          # The registry's HTTP status for a package: 200 when npm has it, 404 when npm has never published it, and 000 when no registry answered within 30 seconds.
          registry_status()
          {
            curl -s -o /dev/null --max-time 30 -w '%{http_code}' "https://registry.npmjs.org/$(printf '%s' "$1" | sed 's|/|%2F|')" || true
          }
          unpublished=" "
          published=""
          for package in $packages; do
            status="$(registry_status "$package")"
            case "$status" in
              200) published="$published $package" ;;
              404) unpublished="$unpublished$package " ;;
              *)
                echo "::error::the registry answered $status for $package, so nothing was published"
                exit 1
                ;;
            esac
          done
          if [ "$unpublished" != " " ] && [ "$CANARY" != "true" ] && ! npm whoami >/dev/null 2>&1; then
            echo "::error::npm has never published${unpublished% }, trusted publishing cannot publish a new name, and npm does not accept the NPM_TOKEN secret, so nothing was published"
            exit 1
          fi
          packages="$unpublished$published"
          # The tarball the pack job made of a package, named as npm pack names it; a missing one stops the step.
          tarball()
          {
            file="$PACKED/$(printf '%s' "$1" | sed 's|^@||; s|/|-|')-$version.tgz"
            if [ ! -f "$file" ]; then
              echo "::error::the pack job made no tarball of $1 at $version, so nothing was published" >&2
              return 1
            fi
            printf '%s' "$file"
          }
          for package in $packages; do
            file="$(tarball "$package")"
          done
          # npm gives a package a latest tag with its first publish, so until a
          # stable version exists latest follows the newest prerelease; after
          # that, a prerelease moves only its own tag.
          move_latest()
          {
            if ! current="$(npm view "$1" dist-tags.latest 2>/dev/null)"; then
              echo "::warning::could not read the latest tag of $1, so it was left as it is"
              return 0
            fi
            case "$current" in
              *-*)
                for _ in 1 2 3 4 5; do
                  if npm dist-tag add "$1@$version" latest; then
                    return 0
                  fi
                  sleep 15
                done
                return 1
                ;;
            esac
          }
          for package in $packages; do
            case "$unpublished" in
              *" $package "*)
                if [ "$CANARY" = "true" ]; then
                  echo "::notice::npm has never published $package, so the canary leaves it out and its first version comes from a release"
                  continue
                fi
                ;;
            esac
            # A dry run asks the registry too, so it shows what a real run would skip.
            if [ "$(npm view "$package@$version" version 2>/dev/null || true)" = "$version" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "$package@$version is on the registry already; a real run skips it"
                continue
              fi
              echo "$package@$version is on the registry already"
              if [ "$tag" != "latest" ] && [ "$CANARY" != "true" ] && [ "$selection" = "all" ]; then
                move_latest "$package"
              fi
              continue
            fi
            echo "publishing $package"
            file="$(tarball "$package")"
            case "$package" in
              @zerolith/cli)
                if [ "$DRY_RUN" != "true" ]; then
                  for platform in $platforms; do
                    attempt=0
                    until address="$(npm view "$platform@$version" dist.tarball 2>/dev/null)" && [ -n "$address" ] && curl -fsIL "$address" >/dev/null; do
                      attempt=$((attempt + 1))
                      if [ "$attempt" -ge 60 ]; then
                        echo "::error::$platform@$version did not download from the registry within 30 minutes, so @zerolith/cli was not published; an install of it now would lack that binary"
                        exit 1
                      fi
                      sleep 30
                    done
                  done
                fi
                ;;
            esac
            # shellcheck disable=SC2086
            npm publish "$file" $flags
            # A single package moves only its own tag: latest names a set released together.
            if [ "$DRY_RUN" != "true" ] && [ "$tag" != "latest" ] && [ "$CANARY" != "true" ] && [ "$selection" = "all" ]; then
              move_latest "$package"
            fi
          done

  # After the GitHub release, which makes the tag the docs build reads the
  # shown releases from. The docs deploy runs on main, which the Pages
  # environment accepts whichever branch the release ran from.
  docs:
    name: Docs
    needs: [npm, github-release]
    if: ${{ !cancelled() && needs.npm.result == 'success' && (needs.github-release.result == 'success' || needs.github-release.result == 'skipped') && github.event.inputs.dry_run != 'true' && github.event.inputs.canary != 'true' && github.event_name != 'schedule' && (github.event.inputs.package == 'all' || github.event.inputs.package == 'zerolith' || startsWith(github.ref_name, 'zerolith@')) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Deploy the site from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main

  github-release:
    name: GitHub release
    needs: [npm, crate-check, crate]
    if: ${{ !cancelled() && needs.npm.result == 'success' && (needs.crate-check.result == 'success' || needs.crate-check.result == 'skipped') && (needs.crate.result == 'success' || needs.crate.result == 'skipped') && github.event_name == 'workflow_dispatch' && github.event.inputs.canary != 'true' && github.event.inputs.package == 'all' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ github.run_id }}

      - name: Create the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.ts "$version" > release-notes.md
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "zerolith@$version" sbom.cdx.json --target "$GITHUB_SHA" --title "$version" --notes-file release-notes.md $prerelease
          echo "version=$version" >> "$GITHUB_OUTPUT"

  benchmarks:
    name: Benchmarks
    needs: github-release
    if: ${{ !cancelled() && needs.github-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Measure the release on js-framework-benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.github-release.outputs.version }}
        run: gh workflow run benchmarks.yml --ref "zerolith@$VERSION" -f version="$VERSION"

  # Checks the crate and builds it as packaged in a job with no publishing
  # credential, since a build runs the dependencies' build scripts; the
  # crate job below publishes it without building it again.
  crate-check:
    name: crates.io check
    needs: npm
    if: ${{ !cancelled() && github.event.inputs.canary != 'true' && ((startsWith(github.ref_name, 'crate@') && needs.npm.result == 'skipped') || (github.event.inputs.crate == 'true' && needs.npm.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Tag version
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${REF_NAME##*@}" != "$version" ]; then
            echo "::error::the tag $REF_NAME names ${REF_NAME##*@}, but Cargo.toml holds $version"
            exit 1
          fi

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Package
        run: cargo package --package zerolith --locked

  crate:
    name: crates.io
    needs: [npm, crate-check]
    if: ${{ !cancelled() && needs.crate-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -eu
          # The crate-check job built the package; --no-verify packages the source without compiling anything here.
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --package zerolith --locked --no-verify --dry-run
          else
            cargo publish --package zerolith --locked --no-verify
          fi
