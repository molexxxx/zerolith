name: Release

# Publishes the npm packages and the crate with provenance. A tag of the
# form <package>@<version> publishes that package; a manual run publishes
# the package named in the input, or every package in dependency order
# with "all". Trusted publishing on npmjs.com (owner molexxxx, repository
# zerolith, workflow release.yml) is the normal credential; the NPM_TOKEN
# secret is only read when it exists, for the first publish of a package
# that has no trusted publisher yet.
#
# A release that publishes the core also rebuilds the documentation site
# from the same commit and deploys it to GitHub Pages, and a release of
# every package creates a GitHub release tagged zerolith@<version> with the
# version's changelog section and the SBOM. Until a stable version exists,
# each prerelease moves the latest dist-tag as well as its own.
#
# @zerolith/cli carries no binary: one platform package per target does,
# built here on the matching runner. Linux builds on Ubuntu 22.04 so the
# binaries link against glibc 2.35 and run on older distributions.

on:
  push:
    tags:
      - "zerolith@*"
      - "@zerolith/*@*"
      - "crate@*"
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to publish, or "all" for every package in order
        required: true
        default: all
      tag:
        description: npm dist-tag
        required: true
        default: alpha
      crate:
        description: Publish the Rust command line to crates.io too
        type: boolean
        default: false
      dry_run:
        description: Run everything but the upload
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  binaries:
    name: binary ${{ matrix.name }}
    if: github.event.inputs.package == 'all' || github.event.inputs.package == '@zerolith/cli' || startsWith(github.ref_name, '@zerolith/cli@')
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-22.04, binary: zerolith }
          - { name: linux-arm64, runner: ubuntu-22.04-arm, binary: zerolith }
          - { name: darwin-arm64, runner: macos-15, binary: zerolith }
          - { name: darwin-x64, runner: macos-15-intel, binary: zerolith }
          - { name: win32-x64, runner: windows-2025, binary: zerolith.exe }
          - { name: win32-arm64, runner: windows-11-arm, binary: zerolith.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Build
        run: cargo build --release --locked --package zerolith

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  npm:
    name: npm ${{ github.event.inputs.package || github.ref_name }}
    needs: binaries
    if: ${{ !cancelled() && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') && (github.event_name == 'workflow_dispatch' || !startsWith(github.ref_name, 'crate@')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm
        run: npm install --global npm@11.21.1

      - name: Install
        run: npm ci

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Full check
        run: npm run check

      - name: SBOM
        run: npm run sbom > sbom.cdx.json

      - name: Binaries
        if: needs.binaries.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{darwin,linux,win32}-*"
          path: packages/cli/platforms

      - name: Mark the binaries executable
        if: needs.binaries.result == 'success'
        run: find packages/cli/platforms -name zerolith -type f -exec chmod 755 {} +

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -n "$INPUT_PACKAGE" ]; then
            selection="$INPUT_PACKAGE"
          else
            selection="${REF_NAME%@*}"
          fi
          tag="${INPUT_TAG:-alpha}"
          flags="--access public --provenance --tag $tag"
          if [ "$DRY_RUN" = "true" ]; then
            flags="$flags --dry-run"
          fi
          libraries="zerolith @zerolith/router @zerolith/forms @zerolith/client @zerolith/test @zerolith/a11y @zerolith/i18n @zerolith/devtools @zerolith/vite @zerolith/otel"
          platforms="@zerolith/cli-linux-x64 @zerolith/cli-linux-arm64 @zerolith/cli-darwin-arm64 @zerolith/cli-darwin-x64 @zerolith/cli-win32-x64 @zerolith/cli-win32-arm64"
          case "$selection" in
            all) packages="$libraries $platforms @zerolith/cli" ;;
            @zerolith/cli) packages="$platforms @zerolith/cli" ;;
            *) packages="$selection" ;;
          esac
          version="$(node -p "require('./package.json').version")"
          # npm gives a package a latest tag with its first publish, so until a
          # stable version exists latest follows the newest prerelease; after
          # that, a prerelease moves only its own tag.
          move_latest()
          {
            if ! current="$(npm view "$1" dist-tags.latest 2>/dev/null)"; then
              echo "::warning::could not read the latest tag of $1, so it was left as it is"
              return 0
            fi
            case "$current" in
              *-*)
                for _ in 1 2 3 4 5; do
                  if npm dist-tag add "$1@$version" latest; then
                    return 0
                  fi
                  sleep 15
                done
                return 1
                ;;
            esac
          }
          for package in $packages; do
            echo "publishing $package"
            case "$package" in
              @zerolith/cli-*)
                directory="packages/cli/platforms/${package#@zerolith/cli-}"
                ls "$directory"/zerolith* >/dev/null
                # shellcheck disable=SC2086
                (cd "$directory" && npm publish $flags)
                ;;
              @zerolith/cli)
                node scripts/platforms.ts
                # shellcheck disable=SC2086
                npm publish --workspace "$package" $flags
                ;;
              *)
                # shellcheck disable=SC2086
                npm publish --workspace "$package" $flags
                ;;
            esac
            if [ "$DRY_RUN" != "true" ] && [ "$tag" != "latest" ]; then
              move_latest "$package"
            fi
          done

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.cdx.json
          retention-days: 90

  docs:
    name: Docs
    needs: npm
    if: ${{ !cancelled() && needs.npm.result == 'success' && github.event.inputs.dry_run != 'true' && (github.event.inputs.package == 'all' || github.event.inputs.package == 'zerolith' || startsWith(github.ref_name, 'zerolith@')) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ github.sha }}

  github-release:
    name: GitHub release
    needs: [npm, crate]
    if: ${{ !cancelled() && needs.npm.result == 'success' && (needs.crate.result == 'success' || needs.crate.result == 'skipped') && github.event_name == 'workflow_dispatch' && github.event.inputs.package == 'all' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ github.run_id }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.ts "$version" > release-notes.md
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "zerolith@$version" sbom.cdx.json --target "$GITHUB_SHA" --title "$version" --notes-file release-notes.md $prerelease

  crate:
    name: crates.io
    if: startsWith(github.ref_name, 'crate@') || github.event.inputs.crate == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -eu
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --package zerolith --locked --dry-run
          else
            cargo publish --package zerolith --locked
          fi
