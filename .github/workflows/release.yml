name: Release

# Publishes the package named by the tag (for example zerolith@1.0.0) with npm provenance.
# Trusted publishing must be configured for this repository and workflow on npmjs.com
# before the first real publish; until then every run is a dry run.

on:
  push:
    tags:
      - "zerolith@*"
      - "@zerolith/*@*"
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package name to publish
        required: true
        default: zerolith

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Resolve package from tag
        id: pkg
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
        run: |
          if [ -n "$INPUT_PACKAGE" ]; then
            name="$INPUT_PACKAGE"
          else
            name="${REF_NAME%@*}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Full check
        run: npm run check

      - name: SBOM
        run: npm run sbom > sbom.cdx.json

      - name: Publish (dry run)
        env:
          PACKAGE: ${{ steps.pkg.outputs.name }}
        run: npm publish --workspace "$PACKAGE" --access public --provenance --dry-run

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.cdx.json
          retention-days: 90
