name: CI

on:
  push:
    branches: [main, "[0-9]*.x"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release line moves with main, so a push of a commit main already holds
  # skips the checks main's own run makes on it.
  on-main:
    name: Already on main
    if: ${{ github.event_name == 'push' && github.ref_name != 'main' }}
    runs-on: ubuntu-24.04
    outputs:
      contained: ${{ steps.compare.outputs.contained }}
    steps:
      - name: Compare with main
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status || echo unknown)"
          case "$status" in
            identical | behind) contained=true ;;
            *) contained=false ;;
          esac
          echo "main compared with $GITHUB_SHA: $status"
          echo "contained=$contained" >> "$GITHUB_OUTPUT"

  check:
    name: Node ${{ matrix.node }}
    needs: on-main
    if: ${{ !cancelled() && needs.on-main.outputs.contained != 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Advisories
        run: |
          npm audit
          npm audit signatures

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with the coverage floor
        if: ${{ matrix.node == 24 }}
        run: npm run test:coverage

      - name: Test (Node)
        if: ${{ matrix.node != 24 }}
        run: npm test

      - name: Test (browser)
        if: ${{ matrix.node != 24 }}
        run: npm run test:browser

      - name: Size budget
        run: npm run size

      - name: Docs
        run: npm run docs

      - name: SBOM
        run: npm run sbom > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-node${{ matrix.node }}
          path: sbom.cdx.json
          retention-days: 30

  rust:
    name: Rust
    needs: on-main
    if: ${{ !cancelled() && needs.on-main.outputs.contained != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"
          command: check
          command-arguments: advisories

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build packages
        run: npm run build

      - name: Test the bundled build
        run: npm run test:cli
        env:
          ZEROLITH_BINARY_PATH: target/release/zerolith

      - name: Check every project zerolith new writes
        run: npm run scaffolds
        env:
          ZEROLITH_BINARY_PATH: target/release/zerolith

  benchmark:
    name: Benchmark
    needs: on-main
    if: ${{ !cancelled() && needs.on-main.outputs.contained != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the core
        run: npm run build --workspace zerolith

      - name: Restore the baseline build
        id: baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-cache
          key: bench-baseline-${{ hashFiles('benchmarks/baseline', 'benchmarks/compare.ts') }}

      - name: Compare with the baseline
        env:
          ZEROLITH_BENCH_CACHE: ${{ github.workspace }}/.bench-cache
        run: npm run bench:compare -- --base baseline --threshold 5

      - name: Save the baseline build
        if: ${{ !cancelled() && steps.baseline.outputs.cache-hit != 'true' && hashFiles('.bench-cache/*/index.js') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-cache
          key: bench-baseline-${{ hashFiles('benchmarks/baseline', 'benchmarks/compare.ts') }}

  rust-windows:
    name: Rust on Windows
    needs: on-main
    if: ${{ !cancelled() && needs.on-main.outputs.contained != 'true' }}
    runs-on: windows-2025
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain

      - name: Test
        run: cargo test --locked
