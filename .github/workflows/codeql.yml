name: CodeQL

# Static analysis of the TypeScript and JavaScript, the Rust command line,
# and the workflows themselves, on every push to main, every pull request,
# and weekly, so a new query catches what existing code already does. The
# job fails on any finding and lists each one in its log, so a finding
# stops the build instead of waiting in the Security tab. A newer push
# cancels a pull request's run, but a run on main always finishes, since an
# analysis stopped partway reports a configuration error on the Security
# tab until the next one completes.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

      - name: Fail on findings
        env:
          SARIF: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          jq -r '.runs[].results[] | select((.suppressions // []) | length == 0) | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' "$SARIF"/*.sarif > findings.txt
          cat findings.txt
          test ! -s findings.txt
